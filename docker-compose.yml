services:
  iptv-manager:
    image: ghcr.io/dtqeight/iptv-manager:latest
    container_name: iptv-manager
    restart: unless-stopped

    # host 网络：udpxy 要收组播、抓取要看镜像流量，都必须用真实网卡
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN

    volumes:
      # 频道清单 + 备份都在这
      - ./data:/data

    environment:
      - TZ=Asia/Shanghai
      # 管理页端口
      - PORT=8080

      # ---- 内置 udpxy ----
      - UDPXY_ENABLE=1
      # 组播转 HTTP-TS 的端口，播放器填 http://<NAS-IP>:4022/rtp/239.x.x.x:1025
      - UDPXY_PORT=4022
      - UDPXY_CLIENTS=10
      - UDPXY_BUFSIZE=65536
      - UDPXY_BUFFERS=32
      # 收组播的网卡，留空让 udpxy 自己选；多网卡建议写死，如 enp3s0
      - UDPXY_IFACE=

      # ---- 自动抓取（交换机镜像口） ----
      # 镜像口在哪个网卡上；留空就在页面里选
      - IPTV_IFACE=
